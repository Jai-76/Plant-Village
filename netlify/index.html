<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantGuard AI</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #071a12; color: #e5f7ed; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
    .card { padding: 32px; border: 1px solid #1b5b42; border-radius: 20px; background: #0b241b; }
    h1 { color: #6ee7b7; margin-top: 0; }
    label, button { display: inline-block; margin-top: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: #10b981; color: #042114; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; color: #a7f3d0; }
    .result { margin-top: 20px; padding: 18px; border-radius: 12px; background: #123b2b; }
    .result + .result { margin-top: 10px; }
    .muted { color: #a7b8ae; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>PlantGuard AI</h1>
      <p class="muted">Upload a leaf image to identify its crop and likely disease.</p>
      <input id="image" type="file" accept="image/*">
      <br>
      <button id="scan">Analyze image</button>
      <p id="status" role="status"></p>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const input = document.querySelector("#image");
    const button = document.querySelector("#scan");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");

    button.addEventListener("click", async () => {
      const file = input.files[0];
      if (!file) { status.textContent = "Choose an image first."; return; }
      button.disabled = true;
      status.textContent = "Analyzing...";
      results.replaceChildren();
      try {
        const body = new FormData();
        body.append("file", file);
        const response = await fetch("/api/predict", { method: "POST", body });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Prediction failed.");
        data.predictions.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "result";
          card.innerHTML = `<strong>${index + 1}. ${item.crop} — ${item.condition}</strong>
            <div>${(item.probability * 100).toFixed(1)}% confidence</div>
            ${item.description ? `<p>${item.description}</p>` : ""}
            ${item.treatment.length ? `<p class="muted"><strong>Recommended care:</strong> ${item.treatment.join(" ")}</p>` : ""}`;
          results.append(card);
        });
        status.textContent = "Analysis complete.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
